<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="base-path" content=".">

    <!-- Styles -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/nav.css">
    <link rel="stylesheet" href="./assets/css/index.css">

    <!-- Scripts -->
    <script defer src="./assets/scripts/main.js"></script>
    <script defer src="./assets/scripts/slideshow.js"></script>

    <!-- Icons & Fonts -->
    <script src="https://kit.fontawesome.com/fd285000eb.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Zen+Dots&display=swap" rel="stylesheet">

    <title>iRO — Israel Hinojosa Baliño</title>
</head>
<body>

<header>
    <h1 class="hatched-text">iRO</h1>
    <p class="subtitle-text"> ishiba ro's webpage</p>
</header>

<main>
    <div class="container">

        <!-- Nav injected here by main.js -->
        <div id="nav-placeholder"></div>

        <div class="main top">
            <blockquote id="quote-block">
                <!-- Filled by main.js from quotes.json -->
            </blockquote>
        </div>

        <!-- ── HERO ── -->
        <div class="ix-hero">
            <div class="ix-bg-slide" data-src="./assets/images/image01.jpg" aria-hidden="true"></div>
            <div class="ix-bg-slide" data-src="./assets/images/image02.jpg" aria-hidden="true"></div>
            <div class="ix-bg-slide" data-src="./assets/images/image03.jpg" aria-hidden="true"></div>
            <div class="ix-bg-slide" data-src="./assets/images/image04.jpg" aria-hidden="true"></div>
            <div class="ix-bg-slide" data-src="./assets/images/image05.jpg" aria-hidden="true"></div>
            <div class="ix-bg-slide" data-src="./assets/images/image06.jpg" aria-hidden="true"></div>

            <div class="ix-overlay" aria-hidden="true"></div>

            <div class="ix-content">
                <div class="ix-text">
                    <div class="ix-eyebrow" data-i18n="index.eyebrow"></div>
                    <h2 class="ix-title" data-i18n="index.title"></h2>
                    <p class="ix-sub" data-i18n="index.sub"></p>

                    <div class="ix-pills">
                        <span class="ix-pill ix-purple">PhD · Durham University</span>
                        <span class="ix-pill ix-teal">MSc GIS · UCL</span>
                        <span class="ix-pill ix-blue" data-i18n="index.pill_msca"></span>
                        <span class="ix-pill ix-amber">Open Source</span>
                    </div>

                    <div class="ix-cta">
                        <a class="ix-btn-primary" href="./profile.html" data-i18n="index.cta_profile"></a>
                        <a class="ix-btn-ghost"   href="./portfolio.html" data-i18n="index.cta_portfolio"></a>
                    </div>
                </div>

                <div class="ix-portrait-wrap">
                    <img class="ix-portrait" src="./assets/images/Ischeba-1.-1.jpg" alt="Israel Hinojosa Baliño">
                </div>
            </div>

            <div class="ix-dots" aria-hidden="true"></div>
        </div>

        <div class="bottom">
            <div class="dynamicc">
                <div class="boxd boxd1" data-i18n="bottom_tags.archaeology"></div>
                <div class="boxd boxd2" data-i18n="bottom_tags.software"></div>
                <div class="boxd boxd3" data-i18n="bottom_tags.data"></div>
            </div>
        </div>

    </div>
</main>

<div class="foot">
    <p data-i18n="footer.tagline"></p>
</div>

</body>
</html>
